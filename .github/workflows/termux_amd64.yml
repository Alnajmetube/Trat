name: Build Termux ARM64 Binary

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-termux:
    name: Build Termux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docer image
        shell: bash
        run: |
          set -e

          mkdir -p "${GITHUB_WORKSPACE}/build"
          sudo chmod -R 777 "${GITHUB_WORKSPACE}"

          docker run --rm \
            --platform linux/arm64 \
            --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -e

              echo "Termux ARM64 build environment"

              echo "Checking architecture..."
              uname -m

              if [ "$(uname -m)" != "aarch64" ]; then
                echo "ERROR: Container is not running as aarch64"
                exit 1
              fi

              echo "==== Updating Termux packages ===="

              pkg update -y

              echo "Installing build dependencies..."
              pkg install -y \
                python \
                clang \
                make \
                binutils \
                patchelf \
                ccache \
                ldd \
                termux-elf-cleaner \
                zstd \
                file

              echo "==== Checking Python ===="

              python --version
              python -m pip --version

              echo "==== Installing Python dependencies ===="


              if [ -f /workspace/requirements.txt ]; then
                python -m pip install -r /workspace/requirements.txt
              fi

              echo "==== Installing Nuitka ===="

              python -m pip install --upgrade Nuitka
              python -m nuitka --version

              echo "==== Preparing source ===="

              WORK_DIR="$HOME/work"

              rm -rf "$WORK_DIR"
              mkdir -p "$WORK_DIR"

              cp -r /workspace/. "$WORK_DIR/"

              cd "$WORK_DIR"

              rm -rf build_out
              mkdir -p build_out

              echo "==== Building ARM64 binary ===="

              python -m nuitka \
                --mode=onefile \
                --lto=yes \
                --remove-output \
                --output-dir=build_out \
                --output-filename=trat_amd64 \
                main.py

              echo "===== Checking build result ====="

              if [ ! -f "build_out/trat_amd64" ]; then
                echo "ERROR: Binary was not created"
                ls -lah build_out || true
                exit 1
              fi

              chmod +x build_out/trat_amd64


              echo "===== Cleaning binary ====="


              strip build_out/trat_amd64 || true

              if command -v termux-elf-cleaner >/dev/null 2>&1; then
                termux-elf-cleaner build_out/trat_amd64 || true
              fi


              echo "Binary information"


              file build_out/trat_amd64
              ls -lh build_out/trat_amd64


              echo "Copying binary"


              cp build_out/trat_amd64 /workspace/build/

              echo "BUILD SUCCESSFUL"
            '

      - name: Verify artifact
        shell: bash
        run: |
          set -e

          if [ ! -f "build/trat_amd64" ]; then
            echo "ERROR: Build artifact does not exist"
            exit 1
          fi

          file build/trat_amd64
          ls -lh build/trat_amd64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trat-arm64
          path: build/trat_amd64
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-termux-arm64-${{ github.run_number }}
          name: Termux ARM64 Build ${{ github.run_number }}
          files: build/trat_amd64
          generate_release_notes: true
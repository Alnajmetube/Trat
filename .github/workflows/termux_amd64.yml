name: Build Trat Termux ARM64

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Trat ARM64
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # QEMU
      # ==========================================
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64


      # ==========================================
      # Build
      # ==========================================
      - name: Build Trat Termux ARM64
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing build directory"
          echo "========================================"

          mkdir -p "$GITHUB_WORKSPACE/build"

          # NOTE: do not rely only on globally forcing 777 here; we will run the container as the host user.
          # chmod -R 777 "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Starting ARM64 Termux container"
          echo "========================================"

          # run container as host UID:GID so files created in /workspace are writable by runner
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)

          docker run --rm \
            --platform linux/arm64 \
            -u "$HOST_UID:$HOST_GID" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e HOST_UID="$HOST_UID" -e HOST_GID="$HOST_GID" \
            termux/termux-docker:aarch64 \
            bash -c '

              set -euo pipefail

              echo "========================================"
              echo "Termux ARM64 Environment"
              echo "========================================"

              echo "Architecture:"
              uname -m

              if [ "$(uname -m)" != "aarch64" ]; then
                echo "ERROR: ARM64 environment was not detected."
                exit 1
              fi

              # ==========================================
              # Update packages
              # ==========================================
              echo "========================================"
              echo "Updating Termux packages"
              echo "========================================"

              pkg update -y
              pkg upgrade -y

              # ==========================================
              # Install dependencies
              # ==========================================
              echo "========================================"
              echo "Installing build dependencies"
              echo "========================================"

              pkg install -y \
                python \
                clang \
                make \
                binutils \
                patchelf \
                ccache \
                ldd \
                termux-elf-cleaner \
                zstd \
                file

              # ==========================================
              # Python
              # ==========================================
              echo "========================================"
              echo "Python information"
              echo "========================================"

              python --version
              python -m pip --version

              # ==========================================
              # Prepare build directory
              # ==========================================
              echo "========================================"
              echo "Preparing source"
              echo "========================================"

              BUILD_DIR="$HOME/build"
              OUTPUT_DIR="$BUILD_DIR/output"

              rm -rf "$BUILD_DIR"

              mkdir -p "$BUILD_DIR"
              mkdir -p "$OUTPUT_DIR"

              cp -r /workspace/. "$BUILD_DIR/"

              cd "$BUILD_DIR"

              # ==========================================
              # Install Python dependencies
              # ==========================================
              echo "========================================"
              echo "Installing Python dependencies"
              echo "========================================"

              if [ -f requirements.txt ]; then
                python -m pip install -r requirements.txt
              else
                echo "No requirements.txt found."
              fi

              # ==========================================
              # Install Nuitka
              # ==========================================
              echo "========================================"
              echo "Installing Nuitka"
              echo "========================================"

              python -m pip install --upgrade Nuitka

              python -m nuitka --version

              # ==========================================
              # Validate source
              # ==========================================
              echo "========================================"
              echo "Checking source"
              echo "========================================"

              if [ ! -f main.py ]; then
                echo "ERROR: main.py was not found."
                exit 1
              fi

              # ==========================================
              # Build
              # ==========================================
              echo "========================================"
              echo "Compiling Trat with Nuitka"
              echo "========================================"

              python -m nuitka \
                --mode=onefile \
                --lto=yes \
                --remove-output \
                --output-dir="$OUTPUT_DIR" \
                --output-filename=Trat \
                main.py

              # ==========================================
              # Verify binary
              # ==========================================
              echo "========================================"
              echo "Verifying binary"
              echo "========================================"

              BINARY="$OUTPUT_DIR/Trat"

              if [ ! -f "$BINARY" ]; then
                echo "ERROR: Binary was not created."
                ls -lah "$OUTPUT_DIR"
                exit 1
              fi

              chmod +x "$BINARY"

              # ==========================================
              # Clean binary
              # ==========================================
              echo "========================================"
              echo "Cleaning binary"
              echo "========================================"

              strip "$BINARY" || true

              if command -v termux-elf-cleaner >/dev/null 2>&1; then
                  termux-elf-cleaner "$BINARY" || true
              fi

              # ==========================================
              # Final information
              # ==========================================
              echo "========================================"
              echo "Final binary"
              echo "========================================"

              file "$BINARY"
              ls -lh "$BINARY"

              # ==========================================
              # Export binary
              # ==========================================
              echo "========================================"
              echo "Exporting binary"
              echo "========================================"

              cp "$BINARY" /workspace/build/Trat

              # Ensure correct ownership on the workspace file as a fallback (HOST_UID/HOST_GID passed from host)
              if [ -n "${HOST_UID:-}" ] && [ -n "${HOST_GID:-}" ]; then
                chown "$HOST_UID:$HOST_GID" /workspace/build/Trat || true
              fi

              chmod +x /workspace/build/Trat || true

              echo "========================================"
              echo "BUILD SUCCESSFUL"
              echo "========================================"

              echo "Output:"
              ls -lh /workspace/build/Trat
            '

      # ==========================================
      # Verify Artifact
      # ==========================================
      - name: Verify Binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="build/Trat"

          echo "========================================"
          echo "Checking final artifact"
          echo "========================================"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary does not exist."
            exit 1
          fi

          # Try to set executable; do not fail the job if chmod is not permitted on this filesystem
          chmod +x "$BINARY" || echo "Warning: chmod failed on $BINARY (continuing)."

          echo "File:"
          file "$BINARY"

          echo "Size:"
          ls -lh "$BINARY"

          echo "Binary is ready."

      # ==========================================
      # Upload Artifact
      # ==========================================
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: Trat-termux-arm64
          path: build/Trat
          if-no-files-found: error

      # ==========================================
      # GitHub Release
      # ==========================================
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Trat-termux-arm64-${{ github.run_number }}
          name: Trat Termux ARM64 Build ${{ github.run_number }}
          files: build/Trat
          generate_release_notes: true
